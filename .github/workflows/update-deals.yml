name: Update deals

on:
  schedule:
    # Every 3 hours at minute 17 (UTC). GitHub may delay cron runs a few minutes.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}  # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch deal feeds
        run: node scripts/fetch-deals.mjs

      - name: Commit updated data
        run: |
          git config user.name "dealguard-bot"
          git config user.email "dealguard-bot@users.noreply.github.com"
          git add deals.json retailers.json
          git diff --cached --quiet || git commit -m "chore: refresh deal data [skip ci]"
          git push
